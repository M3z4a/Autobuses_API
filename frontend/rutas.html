<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Gestión de Rutas</h1>
    <!--boton para volver al menu principal-->
    <a href="index.html" class="back-button">
        ← Volver al menú</a>

    <hr>

    <h2>Registrar Ruta</h2>
        <!--campos necesarios para registrar una ruta-->
    <input type="text" id="routeOrigin" placeholder="Origen">
    <br><br>

    <input type="text" id="routeDestination" placeholder="Destino">
    <br><br>

    <input type="text" id="routeDepartureTime" placeholder="Hora de salida">
    <br><br>

    <input type="number" id="routeCompanyId" placeholder="ID Empresa">
    <br><br>
        <!-- boton para la creacion de rutas -->
    <button id="createRouteBtn">
        Registrar Ruta
    </button>
    <!-- se mostrara unmensaje de error o exito depende la situacion -->
    <p id="routeMessage"></p>
    <hr>

    <h2>Rutas Registradas</h2>
    <!-- boton de carga de rutas -->
    <button id="loadRoutesBtn">
        Cargar Rutas
    </button>

    <ul id="routesList"></ul>
    <!-- trae los scripts necesarios para la pagina -->
    <script src="app.js"></script>

</body>
</html>
