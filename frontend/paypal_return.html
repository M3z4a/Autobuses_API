<!DOCTYPE html>
<html>
<head>
    <title>Procesando pago</title>
</head>
<body>
    <h2>Procesando pago...</h2>
    <script src="js/api.js?v=2"></script>
    <script>
    window.onload = async () => {
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");
            const payerId = urlParams.get("PayerID");
            const reservation_id = urlParams.get("reservation_id");
            console.log("TOKEN:", token);
            console.log("PAYER:", payerId);
            console.log("RESERVATION:", reservation_id);
            if (!token || !reservation_id) {
                document.body.innerHTML = "<h2>Error: datos de pago no encontrados</h2>";
                return;
            }
            const response = await fetch(
                `${API_URL}/payments/capture/${token}/${reservation_id}`,
                {
                    method: "POST",
                    headers: authHeaders()
                }
            );
            const data = await response.json();
            document.body.innerHTML = `
                <h2>${data.message}</h2>
                <p>Status: ${data.paypal_status}</p>
                <p>Regresando a reservaciones...</p>
            `;
            setTimeout(() => {
                window.location.href = "dashboard.html?page=reservations&cache=" + Date.now();
            }, 2000);
        } catch (error) {
            console.error(error);
            document.body.innerHTML = "<h2>Error procesando pago</h2>";
        }
    };
    </script>
</body>
</html>
